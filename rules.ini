# robustesse : reponses non conformes
[rule]
host = *.monapp.test
path = /api/v1/commit
method = POST
inject_status = 429
latency_ms = 800

[rule]
host = *.monapp.test
path = /health
method = GET
inject_status = 200
mutate_header = x-backend:ltg-health

[rule]
host = *.monapp.test
path = /api/.*/export
method = *
inject_status = 500
mock_script = fallback.luau

[rule]
host = *.monapp.test
path = /api/v1/upload
method = *
mutate_header = x-backend:simulated
inject_status = 413
strip_body = true
